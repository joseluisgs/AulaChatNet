<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AulaChatNet</title>
    <base href="/" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="css/app.css" />
</head>
<body>
    <!--
      Pantalla de carga (splash): se ve mientras el navegador descarga el
      runtime de WebAssembly (unos MB la primera vez). Blazor vacía este
      div en cuanto arranca y pinta la app encima.
    -->
    <div id="app">
        <div class="carga">
            <img class="carga-icono"
                 src="resources/icon-app.png"
                 alt="AulaChatNet"
                 width="88" height="88" />
            <div class="carga-logo"># AulaChatNet</div>
            <div class="carga-texto">Cargando el chat&hellip;</div>
            <div class="carga-barra"><span></span></div>
        </div>
    </div>

    <!-- Aviso de error irrecuperable (runtime de Blazor caído en mitad de la sesión) -->
    <div id="blazor-error-ui">
        Se ha producido un error inesperado. Recarga la página para continuar.
        <a href="" class="reload">Recargar</a>
        <button type="button" class="dismiss" aria-label="Cerrar">✕</button>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // Utilidades mínimas de la UI en JavaScript puro (sin librerías):
        // el scroll de la lista de mensajes y el foco del cuadro de texto.
        // Blazor las llama con JSInterop desde los componentes.
        window.aulachat = {
            abajo: function (id) {
                var lista = document.getElementById(id);
                if (lista) lista.scrollTop = lista.scrollHeight;
            },
            enfocar: function (id) {
                var campo = document.getElementById(id);
                if (campo) campo.focus();
            },

            // Parpadeo del título de la pestaña cuando alguien te menciona:
            // alterna el título con el aviso; se PARA al volver a la pestaña
            // (focus) o al dar el badge por visto (terminarParpadeo). Un solo
            // parpadeo a la vez
            parpadeoTitulo: null,
            tituloOriginal: null,
            empezarParpadeo: function (texto) {
                if (window.aulachat.parpadeoTitulo) return;

                window.aulachat.tituloOriginal = document.title;
                var original = window.aulachat.tituloOriginal;
                var alterna = false;

                window.aulachat.parpadeoTitulo = setInterval(function () {
                    alterna = !alterna;
                    document.title = alterna ? texto : original;
                }, 1200);

                window.addEventListener('focus', window.aulachat.terminarParpadeo);
            },
            terminarParpadeo: function () {
                if (!window.aulachat.parpadeoTitulo) return;

                clearInterval(window.aulachat.parpadeoTitulo);
                window.aulachat.parpadeoTitulo = null;
                document.title = window.aulachat.tituloOriginal;
                window.removeEventListener('focus', window.aulachat.terminarParpadeo);
            }
        };
    </script>
</body>
</html>
